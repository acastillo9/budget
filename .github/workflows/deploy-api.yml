name: Deploy Budget API to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'budget-api/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./budget-api/Dockerfile
          push: true
          no-cache: true
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/budget-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/budget-api:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/budget-api
            docker compose pull budget-api
            docker compose up -d --force-recreate budget-api
            docker compose exec -T budget-api node node_modules/.bin/migrate-mongo up
            docker image prune -f
